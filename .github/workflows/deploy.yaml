name: deploy

on:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: |
          uv python install 3.13
          uv python pin 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v --disable-warnings

  docker_image:
    name: Build the image of the application then push it on DockerHub
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/M2i_CDSD_Projet /app
      
      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/M2i_CDSD_Projet
  
  
  hugging_face:
    name: Deploy on HuggingFace
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install huggingface
        run: pip install huggingface[cli]

      - name: Push on HuggingFace repository
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_SPACENAME: ${{ secrets.HUGGINGFACE_SPACENAME }}
        run: |
          git config --global user.email "github-actions[bot]@user.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACENAME hf-space

          cd hf-space

          # cp ../api.py ./
          # cp ../model.pkl ./
          # cp ../Dockerfile ./
          # cp ../requirements.txt ./

          git add .
          git commit -m "Deploy from Github actions"
          git push https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACENAME main