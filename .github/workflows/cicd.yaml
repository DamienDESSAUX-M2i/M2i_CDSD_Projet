name: cicd

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  COVERAGE_THRESHOLD: 10

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: |
          uv python install $PYTHON_VERSION
          uv python pin $PYTHON_VERSION

      - name: Sync dependencies
        run: uv sync --group api --group dev

      - name: Run tests
        run: |
          uv run pytest \
            -v \
            --disable-warnings \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload XML coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  quality:
    name: Ruff & MyPy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: |
          uv python install $PYTHON_VERSION
          uv python pin $PYTHON_VERSION

      - name: Sync dependencies
        run: uv sync --group api --group dev

      - name: Run Ruff
        run: uv run ruff check api/backend api/frontend

      - name: Run MyPy
        run: uv run mypy api/backend api/frontend

  docker:
    name: Build & Publish Docker image
    runs-on: ubuntu-latest

    needs:
      - tests
      - quality
    outputs:

      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-huggingface:
    name: Deploy API to Hugging Face
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@user.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Push API to Hugging Face Space
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGINGFACE_SPACENAME: ${{ secrets.HUGGINGFACE_SPACENAME }}
          IMAGE_NAME: ${{ needs.docker.outputs.image_name }}
        run: |
          git clone https://huggingface.co/spaces/${HUGGINGFACE_SPACENAME} hf-space

          cd hf-space

          echo "FROM ${IMAGE_NAME}:latest" > Dockerfile

          git add Dockerfile

          git commit \
            -m "Deploy from GitHub Actions ${GITHUB_SHA}" || echo "No changes"

          git push \
            https://user:${HUGGINGFACE_TOKEN}@huggingface.co/spaces/${HUGGINGFACE_SPACENAME} \
            main